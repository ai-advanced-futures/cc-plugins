version: "1.0.0"
patterns:
  - pattern_id: "P1"
    name: "Per-seat subscription"
    acv_band: "any"
    description: "Classic seat license — the pre-AI SaaS baseline. Stable margins for bounded surfaces; breaks at the application layer for unbounded agents."
    audience_default: "customer-facing"
  - pattern_id: "P2"
    name: "Per-task / per-action"
    acv_band: "$0-$50k"
    description: "Charge per discrete action the agent takes (resolved ticket, generated draft, etc.). Tight cost coupling but exposes volume swings to the customer."
    audience_default: "customer-facing"
  - pattern_id: "P3"
    name: "Per-resolution with Quality SLA"
    acv_band: "$50k-$250k"
    description: "Tickets/issues priced per resolved instance with a contractual quality floor — fails to that floor → credit/refund per the graduated remedy schedule."
    audience_default: "mixed"
  - pattern_id: "P4"
    name: "Hybrid seat + meter"
    acv_band: "$50k+"
    description: "Combines stable seat fee with per-usage meter; meter unit-rate change capped per period. Predictability with cost coverage."
    audience_default: "customer-facing"
  - pattern_id: "P5"
    name: "Per-user tiered"
    acv_band: "any"
    description: "Seats segmented into tiers by capability or usage band; classic SaaS expansion lever."
    audience_default: "customer-facing"
  - pattern_id: "P6"
    name: "Per-document / per-deliverable"
    acv_band: "$50k-$500k"
    description: "Charge per generated artifact (contract, brief, report). Pairs naturally with vertical-labor-anchor pricing."
    audience_default: "customer-facing"
  - pattern_id: "P7"
    name: "Outcome-only (no quality floor)"
    acv_band: "$0-$100k"
    description: "Pure outcome pricing — paid only on success. Anti-pattern in framework for unbounded surfaces without quality floor."
    audience_default: "customer-facing"
  - pattern_id: "P8"
    name: "Outcome + Quality SLA"
    acv_band: "$100k-$1M"
    description: "Outcome pricing paired with a contractual quality floor; safer evolution of P7."
    audience_default: "mixed"
  - pattern_id: "P9"
    name: "Budget hard stop"
    acv_band: "any"
    description: "Customer-defined monthly spending cap. Vendor stops billing meter above cap (seat baseline continues). Universal mandatory rider per framework."
    audience_default: "customer-facing"
  - pattern_id: "P10"
    name: "Reserved capacity commitment"
    acv_band: "$500k+"
    description: "Customer commits to N units of capacity; vendor commits to provisioning. Cloud-style reservation pricing."
    audience_default: "customer-facing"
  - pattern_id: "P11"
    name: "Enterprise license agreement (ELA)"
    acv_band: "$1M+"
    description: "All-you-can-eat license for a fixed period. Predictable revenue; risk of margin compression as usage grows."
    audience_default: "customer-facing"
  - pattern_id: "P12"
    name: "Outcome + Quality + Gainshare"
    acv_band: "$100k+"
    description: "Tri-component contract: outcome pricing, quality floor with graduated remedy, and gainshare upside when both parties exceed targets."
    audience_default: "mixed"
  - pattern_id: "P12-Light"
    name: "Outcome + Quality (no gainshare)"
    acv_band: "$50k-$250k"
    description: "Sub-$100k variant of P12 — outcome + quality floor only, gainshare deferred until growth justifies the operational overhead."
    audience_default: "mixed"
  - pattern_id: "P13"
    name: "Risk-sharing partnership"
    acv_band: "$1M+"
    description: "Vendor takes equity-like exposure to customer outcomes (e.g., percentage of customer revenue uplift)."
    audience_default: "mixed"
  - pattern_id: "P14"
    name: "Indexed pricing"
    acv_band: "$250k+"
    description: "Price indexed to an external metric (customer headcount, transaction volume, foundation-model token cost)."
    audience_default: "customer-facing"
  - pattern_id: "P15"
    name: "Pass-through cost trigger"
    acv_band: "any"
    description: "Upstream cost movement > 25% over rolling 12mo → vendor may pass through ≤50% of documented increase on 90-day notice. Customer one-time termination right if pass-through > 10% of annual fees. Universal mandatory rider per framework."
    audience_default: "customer-facing"
  - pattern_id: "P16"
    name: "Term-length discounting"
    acv_band: "any"
    description: "Multi-year commitment unlocks per-year price reductions; standard SaaS practice with explicit predictability framing for AI-era."
    audience_default: "customer-facing"
  - pattern_id: "P17"
    name: "Usage-credit prepayment"
    acv_band: "any"
    description: "Customer prepays a credit balance, drawn down by metered usage. Smooths revenue recognition; risks unused credits at term end."
    audience_default: "customer-facing"
  - pattern_id: "P18"
    name: "Free-tier with paywall"
    acv_band: "$0-$10k"
    description: "Freemium model — limited usage free, paid tier unlocks bound. Acquisition lever for self-serve."
    audience_default: "customer-facing"
  - pattern_id: "P19"
    name: "Vertical-labor-anchor pricing"
    acv_band: "$100k-$1M"
    description: "Price anchored to the cost of the labor the agent displaces (e.g., paralegal hour, support agent hour). Translates AI cost into customer-comprehensible terms."
    audience_default: "customer-facing"
