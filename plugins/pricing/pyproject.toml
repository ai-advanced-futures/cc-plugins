[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricing"
version = "1.13.5"
description = "Agentic pricing plugin — canonical math + Phase 1 Insight workflow"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pricing", "vocabulary_linter"]
