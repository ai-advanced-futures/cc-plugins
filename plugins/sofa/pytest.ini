# The rootdir of the live tests. Run them from plugins/sofa with `make itest`.
[pytest]
testpaths = tests
addopts = -m "not integration" --tb=short
markers =
    integration: live claude -p tests; cost money; run via make itest
    leak_guard: an env-leak guard (a test that reads a failure to show that no env value is in it); CI must run it, tests/test_leak_guards_run_in_ci.py checks that
