[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --ignore=scripts
    -m "not integration"
    --tb=short
markers =
    unit: Unit tests
    integration: live claude -p tests (ADR-0001); cost money; run via make itest
    e2e: End-to-end tests
    slow: Slow tests (use -m "not slow" to skip)
