[pytest]
addopts = -m "not integration" --tb=short
markers =
    integration: Live Claude Code checks; require ARCHITECTURE_ITEST=1.
    leak_guard: Offline checks that failures do not expose environment values.
    registration: Verify that the plugin skills load.
    acceptance: Verify Explorer behavior in fixture projects.
    interactive: Verify the deferred-save helper in an interactive session.
